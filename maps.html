<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Haritalar - Ramazan Aydın Kocaer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.15.1/css/ol.css">
    <style>
        .category-title {
            font-size: 18px;
            color: #007bff;
            margin-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 5px;
        }
        .category-section {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    
    <div class="page-content">
        <nav>
            <div class="lang">
                <a onclick="changeLanguage('tr')">TR</a> | <a onclick="changeLanguage('en')">ENG</a>
            </div>
            <a href="index.html" class="lang-transition" data-i18n="nav-home">Ana Sayfa</a>
            <a href="me.html" class="lang-transition" data-i18n="nav-about">Hakkımda</a>
            <a href="projects.html" class="lang-transition" data-i18n="nav-projects">Projeler</a>
            <a href="maps.html" class="lang-transition" data-i18n="nav-maps">Haritalar</a>
        </nav>
        
        <div class="container fade-in">
            <!-- 1. Harita (Leaflet) -->
            <section class="card">
                <h2 class="lang-transition" data-i18n="map1-title">Mutlaka Görülmesi Gereken Şehirler (Leaflet)</h2>
                
                <div class="location-buttons lang-transition">
                    <button onclick="goToCity('agri')" data-i18n="loc-agri">Ağrı</button>
                    <button onclick="goToCity('ankara')" data-i18n="loc-ankara">Ankara</button>
                    <button onclick="goToCity('antalya')" data-i18n="loc-antalya">Antalya</button>
                    <button onclick="goToCity('ardahan')" data-i18n="loc-ardahan">Ardahan</button>
                    <button onclick="goToCity('balikesir')" data-i18n="loc-balikesir">Balıkesir</button>
                    <button onclick="goToCity('canakkale')" data-i18n="loc-canakkale">Çanakkale</button>
                    <button onclick="goToCity('istanbul')" data-i18n="loc-istanbul">İstanbul</button>
                    <button onclick="goToCity('izmir')" data-i18n="loc-izmir">İzmir</button>
                    <button onclick="goToCity('mersin')" data-i18n="loc-mersin">Mersin</button>
                    <button onclick="goToCity('trabzon')" data-i18n="loc-trabzon">Trabzon</button>
                </div>

                <div class="map-layout">
                    <div id="leaflet-map" style="width: 100%; height: 480px;"></div>
                </div>
            </section>

            <!-- 2. Harita (OpenLayers) -->
            <section class="card">
                <h2 class="lang-transition" data-i18n="map2-title">Ankara'da Gezilecek Yerler (OpenLayers)</h2>
                
                <!-- TARIHI YERLER KATEGORISI -->
                <div class="category-section">
                    <h3 class="category-title lang-transition" data-i18n="cat-historical">Tarihi Yerler</h3>
                    <div class="location-buttons lang-transition">
                        <button onclick="goToLocation('anitkabir')" data-i18n="loc-anitkabir">Anıtkabir</button>
                        <button onclick="goToLocation('kale')" data-i18n="loc-kale">Ankara Kalesi</button>
                        <button onclick="goToLocation('meclis')" data-i18n="loc-meclis">1. TBMM (Meclis)</button>
                        <!-- Çankaya Köşkü Buraya Taşındı -->
                        <button onclick="goToLocation('cankaya')" data-i18n="loc-cankaya">Çankaya Köşkü</button>
                    </div>
                </div>

                <!-- AVM'LER KATEGORISI -->
                <div class="category-section">
                    <h3 class="category-title lang-transition" data-i18n="cat-malls">AVM'ler</h3>
                    <div class="location-buttons lang-transition">
                        <button onclick="goToLocation('ankamall')" data-i18n="loc-ankamall">Ankamall</button>
                        <button onclick="goToLocation('armada')" data-i18n="loc-armada">Armada AVM</button>
                    </div>
                </div>

                <!-- EĞLENCE VE SOSYAL ALANLAR KATEGORISI -->
                <div class="category-section">
                    <h3 class="category-title lang-transition" data-i18n="cat-entertainment">Eğlence ve Sosyal Alanlar</h3>
                    <div class="location-buttons lang-transition">
                        <button onclick="goToLocation('kizilay')" data-i18n="loc-kizilay">Kızılay Meydanı</button>
                        <button onclick="goToLocation('7cadde')" data-i18n="loc-7cadde">7. Cadde</button>
                        <button onclick="goToLocation('sakarya')" data-i18n="loc-sakarya">Sakarya Caddesi</button>
                        <button onclick="goToLocation('tunali')" data-i18n="loc-tunali">Tunalı Hilmi Caddesi</button>
                        <button onclick="goToLocation('goksu')" data-i18n="loc-goksu">Göksu Parkı</button>
                        <button onclick="goToLocation('aoc')" data-i18n="loc-aoc">Atatürk Orman Çiftliği</button>
                        <button onclick="goToLocation('hacettepe')" data-i18n="loc-hacettepe">Hacettepe Beytepe</button>
                    </div>
                </div>

                <div class="map-layout">
                    <div id="ol-map"></div>
                </div>
            </section>

            <!-- Yüzen İletişim Butonu ve Popup -->
            <button id="contactBtn" class="floating-btn lang-transition" data-i18n="btn-contact">Bana Ulaşın</button>
            <div id="contactPopup" class="contact-popup-container">
                <div class="contact-popup-header">
                    <h3 class="lang-transition" data-i18n="pop-title">Bana Ulaşın</h3>
                    <button id="closeContactBtn">&times;</button>
                </div>
                <form action="https://formspree.io/f/BURAYA_LINKINI_YAPISTIR" method="POST">
                    <input type="text" id="formName" name="name" class="lang-transition" placeholder="Adınız" required>
                    <input type="email" id="formEmail" name="email" class="lang-transition" placeholder="E-posta Adresiniz" required>
                    <textarea id="formMessage" name="message" class="lang-transition" rows="4" placeholder="Mesajınız" required></textarea>
                    <button type="submit" class="lang-transition" data-i18n="pop-send">Gönder</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Ekranın Sağından Açılan Genişletilmiş Ortak Panel -->
    <div id="sidePanel" class="side-panel">
        <div class="side-panel-content">
            <button class="close-panel" onclick="closePanel()">&times;</button>
            <img id="panelImg" src="" alt="Location Image">
            <h3 id="panelTitle" class="lang-transition"></h3>
            <p id="panelDesc" class="lang-transition"></p>
        </div>
    </div>

        function changeLanguage(lang) {
            currentLang = lang;
            const elements = document.querySelectorAll('.lang-transition');
            elements.forEach(el => el.style.opacity = 0);

            setTimeout(() => {
                document.querySelectorAll('[data-i18n]').forEach(element => {
                    const key = element.getAttribute('data-i18n');
                    if (translations[lang][key]) {
                        element.innerText = translations[lang][key];
                    }
                });
                document.getElementById('formName').placeholder = translations[lang]['ph-name'];
                document.getElementById('formEmail').placeholder = translations[lang]['ph-email'];
                document.getElementById('formMessage').placeholder = translations[lang]['ph-message'];
                elements.forEach(el => el.style.opacity = 1);
            }, 300);
        }

        document.getElementById('contactBtn').onclick = () => {
            var popup = document.getElementById('contactPopup');
            popup.style.display = (popup.style.display === 'flex') ? 'none' : 'flex';
        }
        document.getElementById('closeContactBtn').onclick = () => {
            document.getElementById('contactPopup').style.display = 'none';
        }
